[package]
name = "steamcorder"
version = "1.2.0"
edition = "2024"
description = "Automatically post new Steam screenshots to a Discord webhook."
authors = ["imfeys"]
publish = false

[[bin]]
name = "Steamcorder"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "9.0.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "json", "native-tls"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
