name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 1.0.0 (leave empty to just build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build Steamcorder.exe
        run: cargo build --release

      # One self-contained exe. The Steam package is the same exe plus the
      # license files, since SteamPipe uploads a directory.
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, steam-dist | Out-Null
          Copy-Item target/release/Steamcorder.exe dist/
          Copy-Item target/release/Steamcorder.exe, LICENSE, THIRD_PARTY_NOTICES.md steam-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Steamcorder
          path: dist/Steamcorder.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Steamcorder-steam
          path: steam-dist/

      # Pushing a tag like v1.0.0, or running this workflow by hand with a
      # version, publishes the exe as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          name: Steamcorder ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Steamcorder.exe
          generate_release_notes: true
          make_latest: true
