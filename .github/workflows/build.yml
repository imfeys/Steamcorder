name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 1.0.0 (leave empty to just build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Steamcorder.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Steamcorder
          --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;."
          Steamcorder.pyw

      - uses: actions/upload-artifact@v4
        with:
          name: Steamcorder
          path: dist/Steamcorder.exe

      # Pushing a tag like v1.0.0, or running this workflow by hand with a
      # version, publishes the exe as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          name: Steamcorder ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Steamcorder.exe
          generate_release_notes: true
          make_latest: true
